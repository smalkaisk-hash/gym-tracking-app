<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1215" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EEF1F3" media="(prefers-color-scheme: light)" />
    <title>FitPulse — Gym Tracker</title>
    <meta
      name="description"
      content="FitPulse is a personal gym tracker for logging workouts, lifts and body weight, and seeing your training split at a glance."
    />
    <!-- Link-preview tags for when the app URL is shared. og:url / og:image are
         omitted deliberately: they need an absolute origin and the host is still
         an open decision (see notice-lib.mjs / check:decisions). Add them once a
         canonical URL exists. The app itself is behind auth, so there is nothing
         else public to describe. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitPulse" />
    <meta property="og:title" content="FitPulse — Gym Tracker" />
    <meta
      property="og:description"
      content="A personal gym tracker for logging workouts, lifts and body weight, and seeing your training split at a glance."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FitPulse — Gym Tracker" />
    <meta
      name="twitter:description"
      content="A personal gym tracker for logging workouts, lifts and body weight, and seeing your training split at a glance."
    />
    <script>
      // Stamp the saved theme + accent before first paint so the page never flashes
      // the wrong ground or a default-blue accent. No saved theme means follow the OS.
      try {
        var t = localStorage.getItem('gym-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var resolved = (t === 'light' || t === 'dark') ? t
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var vars = JSON.parse(localStorage.getItem('gym-theme-vars') || 'null');
        if (vars && vars[resolved]) {
          for (var k in vars[resolved]) document.documentElement.style.setProperty(k, vars[resolved][k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
